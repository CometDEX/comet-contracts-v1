name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        # actions/checkout v4.3.0
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.1 --profile minimal --no-self-update
          rustup target add wasm32v1-none --toolchain 1.91.1

      - name: Install pinned Stellar CLI
        # stellar/stellar-cli v27.0.0
        uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4
        with:
          version: 27.0.0

      - name: Build and test
        run: make test
