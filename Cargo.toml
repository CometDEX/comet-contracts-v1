[workspace]
resolver = "2"

members = [
    "compat/sep-41-token",
    "compat/soroban-fixed-point-math",
    "contracts",
    "factory",
]

[workspace.package]
rust-version = "1.91.1"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies.soroban-sdk]
version = "=27.0.3"

[workspace.dependencies.soroban-token-sdk]
version = "=27.0.3"

# SDK 27-compatible source ports for dependencies whose published releases
# currently target older Soroban SDK versions.
[workspace.dependencies.sep-41-token]
path = "compat/sep-41-token"

[workspace.dependencies.soroban-fixed-point-math]
path = "compat/soroban-fixed-point-math"
