[workspace]
resolver = "2"

members = ["contracts"]

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies.soroban-sdk]
version = "23.0.2"

[workspace.dependencies.soroban-token-sdk]
version = "23.0.2"

[workspace.dependencies.sep-41-token]
git = "https://github.com/kalepail/sep-41-token"

[workspace.dependencies.soroban-fixed-point-math]
git = "https://github.com/kalepail/soroban-fixed-point-math"
